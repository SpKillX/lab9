[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rust_crypto"
version = "0.1.0"
description = "Библиотека на Rust для шифрования данных в рамках лаб. работы"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0",
    "requests>=2.28"
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rust_crypto"